<script>window.CITY_DEMO_MISSIONS=[{"id": 1, "title": "The city that never moves", "subtitle": "A whole city. A different perspective.", "clue": "I contain thousands of buildings,\nbut nobody lives inside me.\n\nRoads cross my surface. Towers touch my sky.\nThe city is before your eyes,\nbut everything is smaller than reality.\n\nFind me.", "verified": false, "hints": [{"text": "Think big, but look for something small.", "cost": 0, "delaySeconds": 0}, {"text": "Look for an overview rather than a single building.", "cost": 2, "delaySeconds": 0}, {"text": "In this rehearsal, your target is a scale city model.", "cost": 3, "delaySeconds": 0}], "stages": [{"id": "photo", "label": "Prove it", "type": "photo", "prompt": "Take a photo with the treasure clearly visible. Include at least one willing team member, where appropriate. Do not block exhibits or photograph other visitors without permission.", "points": 10, "attempts": 2, "grading": "photo"}, {"id": "investigation", "label": "Investigation", "type": "text", "prompt": "REHEARSAL: Name one landmark from this practice list: Merlion, Esplanade, Singapore Flyer, Gardens by the Bay. Replace this with an exhibit-specific question after recce.", "points": 10, "attempts": 2, "grading": "auto", "accepted": ["Merlion", "The Merlion", "Esplanade", "Singapore Flyer", "Gardens by the Bay"], "keywords": [], "matchMode": "exact"}, {"id": "mini", "label": "City connections", "type": "matching", "prompt": "Match each city element to its main role.", "points": 10, "attempts": 2, "grading": "auto", "items": [{"id": "park", "text": "Park"}, {"id": "rail", "text": "Rail station"}, {"id": "homes", "text": "Homes"}], "categories": ["Transport", "Housing", "Green space"], "correct": {"park": "Green space", "rail": "Transport", "homes": "Housing"}}, {"id": "bonus", "label": "Bonus discovery", "type": "text", "prompt": "Describe one small detail your team almost missed. A specific observation earns up to 5 points after organiser review.", "points": 5, "attempts": 2, "grading": "manual"}, {"id": "creative", "label": "Team moment", "type": "team", "prompt": "Create a human version of something in this display. Keep it safe, leave walkways clear, and upload a team photo as proof. Up to 5 points after review.", "points": 5, "attempts": 2, "grading": "manual"}]}, {"id": 2, "title": "Lines that lead somewhere", "subtitle": "Find the story between the lines.", "clue": "I do not move, but I can take you places.\nMy lines connect. My colours guide.\n\nA city becomes a story\nwhen you see it from my side.\n\nFind the place that helps you find your way.", "verified": false, "hints": [{"text": "Look for information that helps people navigate.", "cost": 0, "delaySeconds": 0}, {"text": "Colours and connected lines may be useful.", "cost": 2, "delaySeconds": 0}, {"text": "Rehearsal target: a map or planning display.", "cost": 3, "delaySeconds": 0}], "stages": [{"id": "photo", "label": "Prove it", "type": "photo", "prompt": "Take a photo with the treasure clearly visible. Include at least one willing team member, where appropriate. Do not block exhibits or photograph other visitors without permission.", "points": 10, "attempts": 2, "grading": "photo"}, {"id": "investigation", "label": "Read the map", "type": "choice", "prompt": "REHEARSAL: Which item explains the symbols on a map?", "points": 10, "attempts": 2, "grading": "auto", "options": ["Legend", "Title only", "Photo frame", "Page number"], "correct": "Legend"}, {"id": "mini", "label": "Follow the route", "type": "ordering", "prompt": "Arrange these journey steps from first to last.", "points": 10, "attempts": 2, "grading": "auto", "items": [{"id": "arrive", "text": "Arrive at destination"}, {"id": "choose", "text": "Choose a destination"}, {"id": "travel", "text": "Travel along your route"}, {"id": "plan", "text": "Plan the route"}], "correct": ["choose", "plan", "travel", "arrive"]}, {"id": "bonus", "label": "Bonus discovery", "type": "text", "prompt": "Describe one small detail your team almost missed. A specific observation earns up to 5 points after organiser review.", "points": 5, "attempts": 2, "grading": "manual"}, {"id": "creative", "label": "Team moment", "type": "team", "prompt": "Create a human version of something in this display. Keep it safe, leave walkways clear, and upload a team photo as proof. Up to 5 points after review.", "points": 5, "attempts": 2, "grading": "manual"}]}, {"id": 3, "title": "Where the city breathes", "subtitle": "A little less concrete. A little more life.", "clue": "Between the towers, I make room.\nFor shade. For quiet. For things that bloom.\n\nI am not an empty space,\nbut a living part of this place.\n\nFind the city's greener side.", "verified": false, "hints": [{"text": "Think about the spaces between buildings.", "cost": 0, "delaySeconds": 0}, {"text": "Look for greenery in a planning display.", "cost": 2, "delaySeconds": 0}, {"text": "Rehearsal target: a greenery or park display.", "cost": 3, "delaySeconds": 0}], "stages": [{"id": "photo", "label": "Prove it", "type": "photo", "prompt": "Take a photo with the treasure clearly visible. Include at least one willing team member, where appropriate. Do not block exhibits or photograph other visitors without permission.", "points": 10, "attempts": 2, "grading": "photo"}, {"id": "investigation", "label": "Green choices", "type": "multi", "prompt": "REHEARSAL: Select BOTH features that directly add greenery.", "points": 10, "attempts": 2, "grading": "auto", "options": ["Roof garden", "Tree-lined walkway", "Car park sign", "Concrete wall"], "correct": ["Roof garden", "Tree-lined walkway"]}, {"id": "mini", "label": "Hidden word", "type": "puzzle", "prompt": "Decode this word using A=1, B=2, ... Z=26.\n\n7 · 18 · 5 · 5 · 14", "points": 10, "attempts": 2, "grading": "auto", "accepted": ["GREEN"], "keywords": [], "matchMode": "exact"}, {"id": "bonus", "label": "Bonus discovery", "type": "text", "prompt": "Describe one small detail your team almost missed. A specific observation earns up to 5 points after organiser review.", "points": 5, "attempts": 2, "grading": "manual"}, {"id": "creative", "label": "Team moment", "type": "team", "prompt": "Create a human version of something in this display. Keep it safe, leave walkways clear, and upload a team photo as proof. Up to 5 points after review.", "points": 5, "attempts": 2, "grading": "manual"}]}, {"id": 4, "title": "A city in motion", "subtitle": "Many people. Many journeys.", "clue": "Some travel above. Some travel below.\nSome take a seat. Some take it slow.\n\nOur paths are different,\nbut together we make a city go.\n\nFind a story about getting around.", "verified": false, "hints": [{"text": "Think about everyday journeys.", "cost": 0, "delaySeconds": 0}, {"text": "Look for transport-related information.", "cost": 2, "delaySeconds": 0}, {"text": "Rehearsal target: a mobility or transport display.", "cost": 3, "delaySeconds": 0}], "stages": [{"id": "photo", "label": "Prove it", "type": "photo", "prompt": "Take a photo with the treasure clearly visible. Include at least one willing team member, where appropriate. Do not block exhibits or photograph other visitors without permission.", "points": 10, "attempts": 2, "grading": "photo"}, {"id": "investigation", "label": "Count the connections", "type": "number", "prompt": "REHEARSAL: Three routes each have two stops. How many stops is that in total?", "points": 10, "attempts": 2, "grading": "auto", "correct": 6, "tolerance": 0}, {"id": "mini", "label": "Moving together", "type": "matching", "prompt": "Match each journey to its mode.", "points": 10, "attempts": 2, "grading": "auto", "items": [{"id": "walk", "text": "On foot"}, {"id": "cycle", "text": "On two wheels with pedals"}, {"id": "train", "text": "Along rails"}], "categories": ["Cycling", "Walking", "Rail"], "correct": {"walk": "Walking", "cycle": "Cycling", "train": "Rail"}}, {"id": "bonus", "label": "Bonus discovery", "type": "text", "prompt": "Describe one small detail your team almost missed. A specific observation earns up to 5 points after organiser review.", "points": 5, "attempts": 2, "grading": "manual"}, {"id": "creative", "label": "Team moment", "type": "team", "prompt": "Create a human version of something in this display. Keep it safe, leave walkways clear, and upload a team photo as proof. Up to 5 points after review.", "points": 5, "attempts": 2, "grading": "manual"}]}, {"id": 5, "title": "Stories in the walls", "subtitle": "The past is part of the plan.", "clue": "I have watched the city change.\nMy neighbours grew taller,\nbut my memories remain.\n\nLook for a piece of yesterday\nwith a place in tomorrow.", "verified": false, "hints": [{"text": "Not every valuable building is new.", "cost": 0, "delaySeconds": 0}, {"text": "Look for a story about keeping the past.", "cost": 2, "delaySeconds": 0}, {"text": "Rehearsal target: a heritage or conservation display.", "cost": 3, "delaySeconds": 0}], "stages": [{"id": "photo", "label": "Prove it", "type": "photo", "prompt": "Take a photo with the treasure clearly visible. Include at least one willing team member, where appropriate. Do not block exhibits or photograph other visitors without permission.", "points": 10, "attempts": 2, "grading": "photo"}, {"id": "investigation", "label": "Look a little closer", "type": "observation", "prompt": "REHEARSAL: Describe one detail you notice in your chosen display. The organiser will review this answer. Replace with a recce-verified observation task.", "points": 10, "attempts": 2, "grading": "manual"}, {"id": "mini", "label": "Past to future", "type": "ordering", "prompt": "Put this simple conservation workflow in order.", "points": 10, "attempts": 2, "grading": "auto", "items": [{"id": "repair", "text": "Repair carefully"}, {"id": "record", "text": "Record the original condition"}, {"id": "care", "text": "Maintain over time"}, {"id": "plan", "text": "Plan the conservation work"}], "correct": ["record", "plan", function statusBanner(){if(!S)return '';let msg='',glyph='clock';if(S.team.paused){msg='Your team is paused. Your progress is saved. Please speak to the organiser.';}else if(S.config.status==='lobby'){msg='You are in! The organiser will start the hunt shortly.';}else if(S.config.status==='paused'){msg='The hunt is paused. Your progress is saved. Wait for the organiser to resume.';}else if(S.config.status==='ended'){msg='The event has ended. Your discoveries are saved. Scores may still be under review.';glyph='flag';}else if(S.config.timerEnabled&&S.config.deadlineAt<Date.now()+serverOffset){msg='Time is up. Your progress is saved. Please return to the organiser.';glyph='flag';}return msg?`<div class="callout status-banner">${icon(glyph)}<span>${esc(msg)}</span></div>`:'';}
function playable(){return S&&S.config.status==='live'&&!S.team.paused&&(!S.config.timerEnabled||!S.config.deadlineAt||S.config.deadlineAt>Date.now()+serverOffset);}

icon('compass')}First discovery</span><span class="achievement ${S.submissions.filter(x=>x.photo).length>=4?'earned':''}">${icon('camera')}City photographers</span><span class="achievement ${t.completed>=8?'earned':''}">${icon('star')}City explorers</span></div></section></div><div class="home-side"><section class="card score-card home-score"><div><div class="eyebrow">YOUR SHARED TEAM SCORE</div><div class="score-group"><span class="score-value mono" data-score>${t.score}</span><span class="smalltext">POINTS</span></div><div class="smalltext score-meta">${t.pending?`${t.pending} submission${t.pending===1?'':'s'} awaiting review`:'Every teammate contributes.'}</div></div>${icon('trophy')}</section><section class="card progress-card home-progress"><div class="row between"><h3>The journey so far</h3><span class="progress-value">${t.completed}<span> / 8</span></span></div>${progressBars(t.completed)}<p>${t.completed===8?'All eight treasures found. '+(t.finished?'Your hunt is complete.':'Your final challenge is unlocked.'):'Treasures discovered. Each one brings you closer.'}</p></section><section class="card home-rankings"><div class="row between"><h3 style="font-size:18px">In the running</h3><button class="linkbtn gold" data-action="navigate" data-page="rankings">View all ${icon('arrow')}</button></div>${lb.hidden?`<div class="row mt muted">${icon('lock')}<p class="smalltext">Rankings are locked. The final reveal is coming.</p></div>`:lb.rows.slice(0,3).map(r=>`<div class="teaser-row"><span class="rank">${r.rank}</span><i class="team-dot" style="--team-color:${esc(r.colour)}"></i><span>${esc(r.name)} ${r.id===t.id?'<span class="you-tag">YOU</span>':''}</span><span class="points mono">${r.score}<span class="tiny muted"> pts</span></span></div>`).join('')}</section><section class="card home-team"><div class="row between"><h3 style="font-size:18px">Your crew</h3><span class="tag">${S.members.length} joined</span></div><div class="team-members">${S.members.slice(0,6).map(p=     const m=S.current;if(!m)return finishView();if(!m.started)return homeView();
    const s=m.stage,found=ui.found||storeRead('ch:found:'+stateKey(S),false),isClue=s.type==='photo'&&m.stageIndex===0&&!found;
    return `<div class="mission-shell"><div class="mission-top"><button class="linkbtn" data-action="navigate" data-page="hunt">${icon('back')}Hunt home</button><div class="row">${timer()}<span class="badge gold"><span data-score>${S.team.score}</span> PTS</span></div></div><div class="stage-progress" aria-label="Stage ${m.stageIndex+1} of ${m.stageCount}">${m.stageLabels.map((_,i)=>`<span class="${i<m.stageIndex?'done':i===m.stageIndex?'active':''}"></span>`).join('')}</div><div class="stage-labels">${m.stageLabels.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div>${isClue?`<article class="card clue-card"><span class="badge mint">${m.final?'FINAL CHALLENGE':`MISSION ${String(S.team.index+1).padStart(2,'0')}`} · THE CLUE</span><h1>${esc(m.title)}</h1><div class="clue-riddle">${esc(m.clue)}</div><div class="clue-foot">${icon('compass')}The answer is out there. Look around, not ahead.</div>${button('WE FOUND IT','found','full','','arrow')}<div class="row between mt"><button class="linkbtn" data-action="toggle-hints">${icon('help')}Need a hint?</button><span class="tag">${icon('users')}Stay with your team</span></div>${ui.hints?hintView():''}</article>`:`<article class="card challenge-card"><div class="row between"><span class="badge mint">${m.final?'FINAL CHALLENGE':`MISSION ${String(S.team.index+1).padStart(2,'0')}`} · STAGE ${m.stageIndex+1}</span><span class="badge gold">+${s.points} PTS</span></div><h1>${esc(s.label)}</h1><p class="challenge-prompt">${esc(s.prompt)}</p>${['photo','team'].includes(s.type)?photoView():answerView()}<div class="rule"></div><div class="row between"><button class="linkbtn" data-action="view-clue">${icon('map')}Read the clue</button><button class="linkbtn" data-action="toggle-hints">${icon('help')}Hints</button></div>${ui.hints?hintView():''}</article>`}${S.config.rehearsal?'<p class="tiny muted mt" style="text-align:center">REHEARSAL CONTENT · These example exhibits and questions are not gallery-verified.</p>':''}</div>`;
}
function hintView(){const m=S.current;return `<div class="hint-box">${m.hints?.length?m.hints.map((h,i)=>`<div class="hint-row"><div class="row between"><strong>Hint ${i+1}</strong>${h.unlocked?`<span class="tag mint">Unlocked</span>`:button(h.cost?`Unlock · −${h.cost} pts`:'Unlock · free','hint','ghost small',`data-index="${i}"`, 'unlock')}</div>${h.unlocked?`<p>${esc(h.text)}</p>`:`<p class="tiny">${h.delaySeconds?`Available ${Math.ceil(h.delaySeconds/60)} minute(s) after starting.`:'Use hints in order. Only unlocked hints are shown.'}</p>`}</div>`).join(''):'<p class="smalltext">There are no hints for this challenge. Your discoveries are your best guide.</p>'}</div>`;}
function answerView(){const s=S.current.stage,d=draft();let input='';
    if(['text','observation','puzzle'].includes(s.type)){input=`<label class="eyebrow" for="answer-input">YOUR TEAM'S ANSWER</label><textarea id="answer-input" name="answer" placeholder="What did your team discover?" maxlength="3000" required>${esc(d.answer||'')}</textarea>`;}
    else if(s.type==='number'){input=`<label class="eyebrow" for="answer-input">YOUR ANSWER</label><input id="answer-input" name="answer" type="number" step="any" inputmode="decimal" placeholder="Enter a number" value="${esc(d.answer||'')}" required>`;}
    else if(['choice','multi'].includes(s.type)){input=s.options.map((option,i)=>`<label class="choice"><input type="${s.type==='choice'?'radio':'checkbox'}" name="answer" value="${esc(option)}" ${s.type==='choice'?'required':''} ${(Array.isArray(d.answer)?d.answer.includes(option):d.answer===option)?'checked':''}><span>${esc(option)}</span></label>`).join('');}
    else if(s.type==='matching'){input=s.items.map(item=>`<div class="matching-row"><span>${esc(item.text)}</span><select name="match-${esc(item.id)}" aria-label="Category for ${esc(item.text)}" required><option value="">Choose category</option>${s.categories.map(c=>`<option value="${esc(c)}" ${d.answer?.[item.id]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('');}
    else if(s.type==='ordering'){let order=Array.isArray(d.answer)&&d.answer.length===s.items.length?d.answer:s.items.map(i=>i.id);input=`<p class="smalltext mb">Use the arrows to put the items in order. Top is first.</p><input type="hidden" name="order" value="${esc(JSON.stringify(order))}">${order.map((id,i)=>`<div class="order-row"><span class="order-number">${i+1}</span><span class="order-text">${esc(s.items.find(x=>x.id===id)?.text||id)}</span><div class="order-controls"><button type="button" class="iconbtn" data-action="order" data-index="${i}" data-delta="-1" aria-label="Move ${esc(s.items.find(x=>x.id===id)?.text)} up" ${i===0?'disabled':''}>${icon('up')}</button><button type="button" class="iconbtn" data-action="order" data-index="${i}" data-delta="1" aria-label="Move ${esc(s.items.find(x=>x.id===id)?.text)} down" ${i===order.length-1?'disabled':''}>${icon('down')}</button></div></div>`).join('')}`;}
    return `<form data-form="answer"><div class="answer-wrap stack">${input}</div>${s.grading==='manual'?`<div class="callout info mb">${icon('shield')}<span>Your organiser will review this answer. You can continue the hunt after submitting.</span></div>`:''}<button type="submit" class="btn full" ${!playable()?'disabled':''}>SUBMIT ANSWER ${icon('arrow')}</button><p class="attempts">${s.grading==='manual'?'Thoughtful answers matter more than speed.':`${s.attempts-s.attemptsUsed} attempt${s.attempts-s.attemptsUsed===1?'':'s'} remaining · Scored once for your whole team.`}</p></form>`;
}
function photoView(){const has=ui.photo&&ui.photoKey===stateKey(S);return `<input class="hidden" id="camera-input" type="file" accept="image/*" capture="environment"><input class="hidden" id="gallery-input" type="file" accept="image/*">${has?`<img class="photo-preview" src="${ui.photo}" alt="Preview of your team photo"><div class="photo-save-note">${icon('shield')}<span>${ui.photoSaved?'Draft saved on this device.':'Photo ready. Keep this page open until submitted.'}</span></div><div class="photo-actions">${button('Retake','camera','ghost','','camera')}${button('SUBMIT PHOTO','submit-photo','','','arrow')}</div><div class="upload-track hidden" id="upload-track"><span></span></div><p id="upload-status" class="attempts"></p>`:`<div class="photo-drop"><div><div class="bigicon">${icon('camera')}</div><h3>Make it a team memory.</h3><p>Show the treasure clearly. Include a willing teammate where appropriate.</p></div></div><div class="photo-actions">${button('TAKE PHOTO','camera','','','camera')}${button('Upload from phone','pick-photo','secondary','','upload')}</div><p class="attempts">Camera or photo library · Images are resized before upload.</p>`}`;}
function galleryView(){const photos=S.submissions.filter(s=>s.photo);return `<div class="page-heading"><div><span class="eyebrow">EVERY DISCOVERY HAS A STORY</span><h1>Your team's adventure.</h1><p>${photos.length} memories collected. Only your team and organisers can see them.</p></div><span class="bigicon">${icon('camera')}</span></div>${photos.length?`<div class="gallery-grid">${photos.map(s=>`<button class="photo-card" data-action="open-photo" data-id="${s.id}"><img src="${esc(s.photo)}" loading="lazy" alt="${esc(s.label)} submitted by ${esc(s.player)}"><div class="photo-copy"><span class="eyebrow">${s.mission===9?'FINAL CHALLENGE':'TREASURE '+String(s.mission).padStart(2,'0')}</span><h3>${esc(s.missionTitle)}</h3><p>${esc(s.player)} · ${fmtTime(s.at)}</p><span class="photo-status ${s.status==='pending'?'pending':''}">${s.status==='pending'?(s.points?'Points awarded · review pending':'Awaiting review'):`${s.points} / ${s.maxPoints} pts · ${esc(s.status)}`}</span></div></button>`).join('')}</div>`:`<div class="empty"><div class="bigicon">${icon('image')}</div><h2>Your story starts here.</h2><p>Complete a photo challenge and your team's memories will appear here.</p>${button('BACK TO THE HUNT','navigate','mt','data-page="hunt"','arrow')}</div>`}`;}
function leaderboardContent(lb,teamId=null){if(lb.hidden)return `<div class="empty"><div class="bigicon">${icon('lock')}</div><h2>The suspense is part of it.</h2><p>The leaderboard is locked. Keep exploring. Your organiser will reveal the final rankings.</p></div>`;const rows=lb.rows,top=rows.slice(0,3);return `${top.length===3?`<div class="podium">${[top[1],top[0],top[2]].map((r,i)=>`<div class="podium-card ${i===1?'first':''}"><div class="place">${r.rank===1?'TOP SPOT':`RANK ${r.rank}`}</div><div class="trophy-circle">${icon(i===1?'trophy':'star')}</div><div class="team-title">${esc(r.name)}</div><div class="team-points mono ${i===1?'gold':''}">${r.score}</div><p>POINTS · ${r.completed}/8 TREASURES</p></div>`).join('')}</div>`:''}<div class="rank-table"><div class="rank-row header"><span>#</span><span>TEAM</span><span style="text-align:center">FOUND</span><span style="text-align:right">POINTS</span></div>${rows.map(r=>`<div class="rank-row ${r.id===teamId?'you':''}"><span class="number">${r.rank}</span><div class="rank-name"><i class="team-dot" style="--team-color:${esc(r.colour)}"></i>${esc(r.name)}${r.id===teamId?'<span class="you-tag">YOU</span>':''}</div><span class="rank-progress">${r.completed} / 8</span><span class="rank-score mono">${r.score}</span></div>`).join('')}</div><p class="ranking-note">Discovery comes first. Scores are provisional while reviews are pending. Earlier full-game completion breaks a score tie.</p>`;}
function rankingsView(){return `<div class="rankings-head"><span class="eyebrow gold">EIGHT TEAMS. ONE CITY.</span><h1>The hunt is on.</h1><p>Shared scores. Friendly competition. No spoilers.</p></div>${leaderboardContent(S.leaderboard,S.team.id)}`;}
function moreView(){return `<div class="page-heading"><div><span class="eyebrow">A LITTLE HELP ALONG THE WAY</span><h1>Your field guide.</h1><p>Everything else you need for a great hunt.</p></div></div><div class="mission-shell menu-list">${[['rules','book','Game rules','A few things to keep the adventure fair and safe.'],['help','help','Need a hand?','Photo uploads, lost connections and organiser support.'],['scores','trophy','Where your points came from','Your shared team score, one discovery at a time.']].map(([p,i,t,d])=>`<button class="menu-link" data-action="navigate" data-page="${p}">${icon(i)}<div class="copy"><strong>${t}</strong><p>${d}</p></div>${icon('chevron')}</button>`).join('')}<button class="menu-link" data-action="logout">${icon('logout')}<div class="copy"><strong>Leave this device</strong><p>Your team's progress stays saved. You can rejoin with your team code.</p></div>${icon('chevron')}</button><div class="callout info mt">${icon('users')}<span>Signed in as ${esc(S.player.name)} · ${esc(S.team.name)}. Everyone on your team contributes to the same score.</span></div><button class="linkbtn" data-action="go-admin">${icon('lock')}Organiser dashboard</button></div>`;}
function infoView(which){if(which==='help')return `<div class="page-heading"><div><span class="eyebrow">YOU'RE NOT ON YOUR OWN</span><h1>A little help.</h1></div></div><section class="card prose"><h2 style="margin-top:0">Ask your organiser</h2><p>${esc(config().helpContact||'Please contact your event organiser.')}</p><h3>I cannot upload my photo.</h3><p>Allow camera or photo-library access when your browser asks. Try “Upload from phone” instead, or retake the picture. JPEG and PNG images work in this build. A photo that has been saved as a draft stays on this device until the server confirms your upload. Do not clear your browser data.</p><h3>The connection dropped.</h3><p>Keep the page open and reconnect. Your typed answer and saved photo draft can be retried. Points are added only after the server accepts a submission. Other teammates can continue from their own phones.</p><h3>I closed the page.</h3><p>Open the same web link in the same browser. Your session should return unless cookies were cleared or you used private browsing. Otherwise, join your team again using its code. Team progress is stored on the server.</p><h3>A teammate answered before me.</h3><p>That is teamwork! Your screen will move to the next stage. The same stage can only award points once for the team.</p><h3>Our answer should have counted.</h3><p>Tell the organiser your team name and challenge. They can review saved submissions and make an audited points adjustment.</p><h3>We cannot find a treasure.</h3><p>Use “Need a hint?” on the mission screen. The game will tell you the points cost before you unlock a paid hint.</p><h3>Photo privacy</h3><p>Only your team and signed-in organisers can access your submitted images. Ask permission from everyone in the photo and avoid other visitors. Ask the organiser about their photo retention and deletion arrangements.</p></section>`;
return `<div class="page-heading"><div><span class="eyebrow">CURIOUS MINDS. CONSIDERATE EXPLORERS.</span><h1>How to play.</h1></div></div><section class="card prose"><div class="row wrap"><span class="badge gold">8 TEAMS</span><span class="badge mint">8 TREASURES</span><span class="badge">1 SHARED TEAM SCORE</span></div><h2>Follow the clue, not the crowd.</h2><p>Read your mystery clue, explore the gallery, find the treasure, and take a team photo. Then look closer to solve the investigation and challenges. Each team starts at a different treasure and follows its own fixed order. Future clues stay hidden.</p><h2>Make every discovery count.</h2><p>The example missions offer 10 points for a photo, 10 for an investigation, 10 for a mini challenge, 5 for a bonus answer and 5 for a creative team task. Eight missions total 320 points, followed by a 50-point final challenge. Your organiser can edit the points and award extra bonuses. Hints may deduct points, and manual answers await review.</p><h2>Play fair. Explore safely.</h2><ol><li>Stay with your team. Do not run or block walkways.</li><li>Respect other visitors. Keep noise down and give everyone room.</li><li>Do not touch or move exhibits unless gallery staff permit it.</li><li>Complete the missions in the order shown. Do not share answers with other teams.</li><li>Show the required treasure clearly in photos. Include willing team members where appropriate.</li><li>Follow the instructions of gallery staff and your event organisers.</li><li>Organisers review disputed answers, photos and scoring. Do not rely on speed to win.</li></ol><p>Full-game completion time is recorded and can break a score tie. Equal scores remain tied while neither team has finished.</p></section>`;}
function scoreHistoryView(){return `<div class="page-heading"><div><span class="eyebrow">EVERY POINT HAS A STORY</span><h1>${S.team.score} points, together.</h1><p>Your team's complete scoring record.</p></div></div><section class="card"><div class="score-breakdown">${S.ledger.length?S.ledger.map(l=>`<div class="score-line"><div><div>${esc(l.reason)}</div><small class="muted">${esc(l.actor)} · ${fmtTime(l.at)}</small></div><span class="${l.points<0?'red':'mint'} mono">${l.points>0?'+':''}${l.points}</span></div>`).join(''):'<p class="smalltext">Your first discovery is waiting. Points will appear here as your team plays.</p>'}</div></section>`;}
function receiptView(){const r=ui.receipt;if(r.finished)return finishView();const subs=S.submissions.filter(x=>x.mission===r.missionId),sum=subs.reduce((n,s)=>n+s.points,0);return `<section class="card celebration animate-in"><div class="bigicon">${icon('compass')}</div><span class="eyebrow mint" style="display:block;margin-top:24px">TREASURE DISCOVERED</span><h1>One more story.<br>One step closer.</h1><p class="smalltext">${esc(r.missionTitle)}</p><div class="score-breakdown">${subs.map(s=>`<div class="score-line"><span>${esc(s.label)}${s.status==='pending'?'<small class="muted"> · Review pending</small>':''}</span><span class="${s.points?'mint':'muted'}">+${s.points}</span></div>`).join('')}</div><div class="row between smalltext"><span class="muted">Mission points awarded so far</span><strong class="gold">+${sum}</strong></div><div class="rule"></div><div class="eyebrow">YOUR SHARED TEAM SCORE</div><div class="score-total mono">${S.team.score}</div><p class="smalltext">${S.team.completed} / 8 treasures found</p>${button('CONTINUE THE HUNT','continue','full mt','','arrow')}</section>`;}
function finishView(){const t=S.team,parts=t.scoreParts;return `<section class="card celebration"><div class="bigicon">${icon('trophy')}</div><span class="eyebrow mint" style="display:block;margin-top:25px">CITY HUNT COMPLETE</span><h1>${esc(t.name)},<br>you found your city.</h1><span class="finish-chip">${icon('checkcircle')}8 / 8 TREASURES DISCOVERED</span><div class="score-breakdown">${[['Mission points',parts.mission],['Final challenge',parts.final],['Bonus points',parts.bonus],['Hints & adjustments',parts.hint+parts.adjustment]].map(([name,points])=>`<div class="score-line"><span>${name}</span><span>${points}</span></div>`).join('')}</div><div class="eyebrow">${t.pending?'PROVISIONAL TEAM SCORE':'YOUR TEAM SCORE'}</div><div class="score-total mono">${t.score}</div>${t.pending?`<p class="smalltext">${t.pending} submissions are awaiting review. Your score may change.</p>`:''}<p class="quote">Great cities aren't only built.<br>They're discovered.</p><div class="stack">${button('VIEW TEAM GALLERY','navigate','full','data-page="gallery"','camera')}${button('VIEW LEADERBOARD','navigate','ghost full','data-page="rankings"','trophy')}</div></section>`;}

function adminView(){const cfg=A.config,pending=A.submissions.filter(s=>s.status==='pending').length,currentTab=adminTabs.find(t=>t[0]===ui.adminTab)||adminTabs[0];const adminnav=adminTabs.map(([id,glyph,label])=>`<button class="${id===ui.adminTab?'active':''}" data-action="admin-tab" data-tab="${id}">${icon(glyph)}<span>${label}</span>${id==='reviews'&&pending?`<span class="nav-count">${pending}</span>`:''}</button>`).join('');return `${demoBar()}<div class="admin-layout"><aside class="admin-sidebar">${brand()}<div><div class="admin-side-heading">CONTROL CENTRE</div><nav class="admin-nav" aria-label="Organiser navigation">${adminnav}</nav></div><div class="admin-nav"><button data-action="navigate" data-page="results">${icon('trophy')}Results display</button><button data-action="navigate" data-page="${B.player?'hunt':''}">${icon('arrow')}Player view</button></div><div class="admin-sidebar-foot"><span class="badge ${cfg.status==='live'?'mint':'gold'}"><i class="dot"></i>${esc(cfg.status)}</span><p style="margin-top:12px">${cfg.rehearsal?'Rehearsal event':'Live-event content'}<br>8 teams · 8 rotating routes</p><button class="linkbtn" data-action="admin-logout">${icon('logout')}Sign out</button></div></aside><main class="admin-main"><header class="admin-topbar"><div><span class="eyebrow">CITY HUNT / ORGANISER</span><h1>${ui.editId?'Build a discovery.':currentTab[2]==='Overview'?'A city of possibilities.':currentTab[2]}</h1><p>${esc(cfg.venue)} · ${cfg.rehearsal?'Rehearsal mode':'Event mode'}</p></div><div class="admin-top-controls">${timer()}${cfg.status==='live'?button('Pause game','control','secondary small','data-command="pause"','pause'):button(cfg.status==='paused'?'Resume game':cfg.status==='ended'?'Reopen game':'Start game','control','small',`data-command="${cfg.status==='paused'?'resume':'start'}"`,'play')}${['live','paused'].includes(cfg.status)?button('End','control','ghost small','data-command="end"','stop'):''}${connection()}</div></header><nav class="admin-mobile-nav" aria-label="Organiser navigation">${adminnav}<button data-action="navigate" data-page="results">${icon('trophy')}Results</button><button data-action="navigate" data-page="${B.player?'hunt':''}">${icon('arrow')}Player view</button><button data-action="admin-logout">${icon('logout')}Sign out</button></nav>${cfg.rehearsal?`<div class="callout mb">${icon('help')}<span><strong>Rehearsal mode.</strong> The eight example targets are not verified gallery exhibits. Replace the clues and questions after recce, mark all nine missions verified, then turn off rehearsal mode.</span></div>`:''}${({overview:adminOverview,missions:adminMissions,teams:adminTeams,reviews:adminReviews,points:adminPoints,announcements:adminAnnouncements,settings:adminSettings,share:adminShare,logs:adminLogs}[ui.adminTab]||adminOverview)()}</main></div>`;}
function adminOverview(){const c=A.config,players=A.teams.reduce((n,t)=>n+t.members.length,0),completed=A.teams.reduce((n,t)=>n+Math.min(t.index,8),0),photos=A.submissions.filter(s=>s.photo).length,pending=A.submissions.filter(s=>s.status==='pending').length;return `<div class="metrics-grid">${[['Teams joined',A.teams.filter(t=>t.members.length).length,'/ 8',`${players} players connected`,'users'],['Treasures found',completed,'/ 64','Across all eight teams','compass'],['Photos collected',photos,'','Stories worth remembering','camera'],['Awaiting review',pending,'','Photos and written answers','shield']].map(([label,val,suffix,note,glyph])=>`<section class="metric"><div class="row between"><span class="eyebrow">${label}</span>${icon(glyph)}</div><div class="metric-val mono">${val} <small>${suffix}</small></div><p>${note}</p></section>`).join('')}</div><div class="admin-grid"><section class="card"><div class="row between"><h2 class="section-title">Live team monitor</h2><span class="badge mint"><i class="dot"></i>AUTO-SYNC</span></div><div class="table-scroll"><table><thead><tr><th>TEAM</th><th>SCORE</th><th>PROGRESS</th><th>CURRENT</th><th>STATUS</th></tr></thead><tbody>${A.teams.map(t=>`<tr><td><button class="linkbtn team-label" style="color:var(--text)" data-action="team-reviews" data-team="${t.id}"><i class="team-dot" style="--team-color:${esc(t.colour)}"></i>${esc(t.name)}</button></td><td class="mono"><strong>${t.score}</strong></td><td><div class="mini-progress"><div class="bar"><span style="width:${Math.min(t.index,8)/8*100}%"></span></div>${Math.min(t.index,8)}/8</div></td><td class="muted">${t.index>=9?'Finished':t.index===8?'Final':`Treasure ${t.route[t.index]}`}</td><td><span class="status-chip ${t.paused?'paused':!t.members.length?'waiting':''}"><i class="dot"></i>${t.paused?'Paused':t.index>=9?'Finished':t.startedAt?'Playing':t.members.length?'Ready':'Not joined'}</span></td></tr>`).join('')}</tbody></table></div><div class="rule"></div><p class="tiny muted">Current missions are visible only to organisers, never to competing teams.</p></section><div class="stack"><section class="card"><h2 class="section-title">Make the next move.</h2><p class="smalltext" style="margin-top:9px">A few controls you will use during the hunt.</p><div class="admin-quick">${button('Review submissions','admin-tab','secondary','data-tab="reviews"','camera')}${button('Award a bonus','admin-tab','secondary','data-tab="points"','star')}${button('Send a message','admin-tab','secondary','data-tab="announcements"','bell')}${button(A.leaderboard.hidden?'Unlock rankings':'Lock rankings','control','ghost',`data-command="${A.leaderboard.hidden?'unlock':'lock'}"`,'lock')}</div></section><section class="card"><div class="row between"><h2 class="section-title">Latest discoveries</h2><button class="linkbtn" data-action="admin-tab" data-tab="logs">All activity ${icon('arrow')}</button></div>${activityList(A.logs.slice(0,5))}</section></div></div>`;}
function activityList(logs){return `<div class="activity-list">${logs.length?logs.map(l=>`<div class="activity-item"><div class="activity-icon">${icon(l.team?'compass':'settings')}</div><div class="activity-copy">${esc(l.message)}<small>${l.team?esc(A.teams.find(t=>t.id===l.team)?.name||'Team '+l.team)+' · ':''}${esc(l.actor)} · ${fmtTime(l.at)}</small></div></div>`).join(''):'<p class="smalltext">Team activity will appear here as players join and explore.</p>'}</div>`;}
function adminMissions(){if(ui.editId)return missionEditor();return `<div class="row between wrap mb"><div><h2 class="section-title">Every clue starts a discovery.</h2><p class="smalltext" style="margin-top:9px">Edit all eight treasures and the final challenge. Answer keys stay in the organiser view.</p></div><span class="badge mint">${A.missions.filter(m=>m.verified).length} / 9 VERIFIED</span></div><div class="mission-editor-list">${A.missions.map(m=>`<section class="admin-mission-card"><div class="row between"><span class="badge ${m.id===9?'gold':'mint'}">${m.id===9?'FINAL CHALLENGE':'TREASURE '+String(m.id).padStart(2,'0')}</span><span class="tag ${m.verified?'mint':'gold'}">${icon(m.verified?'checkcircle':'help')}${m.verified?'Recce verified':'Needs recce'}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.subtitle)}</p><div class="row mt"><span class="tag">${m.stages.length} stages</span><span class="tag">·</span><span class="tag">${m.stages.reduce((n,s)=>n+s.points,0)} points</span></div>${button('Edit mission','edit-mission','ghost small',`data-id="${m.id}"`,'edit')}</section>`).join('')}</div>`;}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></label></div>`;}
function area(label,name,value='',note='',extra=''){return `<div class="field"><label>${label}<textarea name="${esc(name)}" ${extra}>${esc(value)}</textarea></label>${note?`<p class="field-note">${note}</p>`:''}</div>`;}
function selectField(label,name,value,options,extra=''){return `<div class="field"><label>${label}<select name="${name}" ${extra}>${options.map(opt=>{const [v,l]=Array.isArray(opt)?opt:[opt,opt];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`;}).join('')}</select></label></div>`;}
function toggle(label,description,name,checked){return `<div class="switch-row"><div class="switch-copy"><strong>${label}</strong><p>${description}</p></div><label class="switch"><input name="${name}" type="checkbox" ${checked?'checked':''} aria-label="${label}"><i></i></label></div>`;}
function missionEditor(){const m=ui.editMission;return `<div class="mission-editor"><button class="linkbtn mb" data-action="cancel-edit">${icon('back')}Back to missions</button><form data-form="mission-editor" id="mission-editor"><section class="card"><div class="row between"><span class="badge mint">${m.id===9?'FINAL CHALLENGE':'TREASURE '+m.id}</span><span class="tag">Editable content</span></div>${field('MISSION TITLE','mission-title',m.title,'text','maxlength="100" required')}${field('SHORT SUBTITLE','mission-subtitle',m.subtitle,'text','maxlength="200"')}${area('TREASURE CLUE / RIDDLE','mission-clue',m.clue,'Players see this clue only when they start this mission.','rows="7" maxlength="5000" required')}${toggle('Recce verified','Confirm the target exists, the answer is checkable, and the task is safe.','mission-verified',m.verified)}<div class="rule"></div><h3 class="section-title">Optional hints</h3><p class="smalltext mt">Leave a hint blank to remove it. Hints are unlocked in order.</p>${Array.from({length:3},(_,i)=>{const h=m.hints[i]||{text:'',cost:0,delaySeconds:0};return `<div class="form-grid">${area(`HINT ${i+1}`,`hint-${i}-text`,h.text,'','rows="2" maxlength="500"')}${field('POINTS COST',`hint-${i}-cost`,h.cost,'number','min="0" max="50"')}${field('UNLOCK DELAY (SECONDS)',`hint-${i}-delay`,h.delaySeconds||0,'number','min="0" max="7200"')}</div>`;}).join('')}</section><div class="row between mt"><h2 class="section-title">Challenge stages</h2><span class="tag">Shown one at a time, in this order.</span></div>${m.stages.map((s,i)=>stageEditor(s,i)).join('')}<div class="row mt">${button('Add a stage','add-stage','ghost small','','plus')}</div><div class="sticky-save"><button class="btn" type="submit">${icon('check')}SAVE MISSION</button>${button('Cancel','cancel-edit','ghost')}</div></form></div>`;}
function stageEditor(s,i){const k=s.type;let extra='';if(['text','observation','puzzle'].includes(k))extra=`<div class="form-grid">${area('ACCEPTED ANSWERS','accepted',(s.accepted||[]).join('\n'),'One accepted answer per line. Used for automatic marking.')}${area('ACCEPTED KEYWORDS','keywords',(s.keywords||[]).join('\n'),'One whole-word or phrase keyword per line. Optional.')}${selectField('KEYWORD POLICY','matchMode',s.matchMode||'exact',[['exact','Alternatives, or any keyword'],['all_keywords','Alternatives, or all keywords']])}${toggle('Case-sensitive marking','Normally leave this off.','caseSensitive',s.caseSensitive)}</div>`;
    if(['choice','multi'].includes(k))extra=`${area('ANSWER OPTIONS','options',(s.options||[]).join('\n'),'One distinct option per line.')} ${area(k==='multi'?'CORRECT OPTIONS':'CORRECT OPTION','correct',Array.isArray(s.correct)?s.correct.join('\n'):s.correct||'',k==='multi'?'One correct option per line, matching the wording above.':'Copy the wording of one option above.','rows="2"')}`;
    if(k==='number')extra=`<div class="form-grid">${field('CORRECT NUMBER','correct',s.correct??'','number','step="any"')}${field('ACCEPTABLE TOLERANCE','tolerance',s.tolerance??0,'number','min="0" step="any"')}${field('OR: MINIMUM ACCEPTED','minAnswer',s.minAnswer??'','number','step="any"')}${field('OR: MAXIMUM ACCEPTED','maxAnswer',s.maxAnswer??'','number','step="any"')}</div><p class="field-note">Leave both range fields blank to use the exact number and tolerance.</p>`;

}

/* Drafts, dialogs and event handlers. */
async function photoDraft(mode,key,value=null){
    try{return await new Promise((resolve,reject)=>{
        const request=indexedDB.open('city-hunt-photo-drafts',1);
        request.onupgradeneeded=()=>request.result.createObjectStore('drafts');
        request.onerror=()=>reject(request.error);
        request.onsuccess=()=>{const db=request.result;const tx=db.transaction('drafts',mode==='get'?'readonly':'readwrite');const table=tx.objectStore('drafts');
            const op=mode==='get'?table.get(key):mode==='delete'?table.delete(key):table.put(value,key);
            let result=null;op.onsuccess=()=>result=mode==='get'?op.result:true;op.onerror=()=>reject(op.error);
            tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(tx.error);};};
    });}catch{return mode==='get'?null:false;}
}
async function restorePhoto(){const m=S?.current;if(m?.stage&&['photo','team'].includes(m.stage.type)){const k=stateKey(S),saved=await photoDraft('get',k);if(saved){ui.photo=saved;ui.photoKey=k;ui.photoSaved=true;ui.found=true;}}}
async function choosePhoto(file){
    if(!file)return;if(file.size>28*1024*1024)throw new Error('Choose a photo smaller than 28 MB.');
    const key=stateKey(S);if(!S?.current?.stage)throw new Error('Open a photo challenge first.');
    const objectURL=URL.createObjectURL(file);
    try{
        const image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Your browser could not read this image. Retake the picture or choose JPEG/PNG.'));im.src=objectURL;});
        const scale=Math.min(1,1600/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
        const context=canvas.getContext('2d');context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
        const data=canvas.toDataURL('image/jpeg',.84);
        if(key!==stateKey(S))throw new Error('Your team moved to another stage while the photo was opening. Check the current challenge.');
        ui.photo=data;ui.photoKey=key;ui.photoSaved=await photoDraft('set',key,data);ui.found=true;storeWrite('ch:found:'+key,true);render();
    }finally{URL.revokeObjectURL(objectURL);}
}
function captureDraft(form=$('form[data-form="answer"]')){if(!form||!S?.current?.stage)return;const fd=new FormData(form),s=S.current.stage;let answer;
    if(s.type==='multi')answer=fd.getAll('answer');else if(s.type==='matching')answer=Object.fromEntries(s.items.map(i=>[i.id,fd.get('match-'+i.id)||'']));else if(s.type==='ordering'){try{answer=JSON.parse(fd.get('order'));}catch{answer=s.items.map(i=>i.id);}}else answer=fd.get('answer')||'';
    storeWrite('ch:draft:'+stateKey(S),{answer});return answer;
}
function closeModal(value=null){const resolve=ui.modalResolve;ui.modalResolve=null;ui.modalSubmit=null;$('#modal-root').innerHTML='';document.body.style.overflow='';if(resolve)resolve(value);ui.modalFocus?.focus?.();ui.modalFocus=null;}
function showModal(title,body,large=false){closeModal();ui.modalFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="close-line"><h2 id="modal-title">${esc(title)}</h2><button class="iconbtn" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div>${body}</section></div>`;document.body.style.overflow='hidden';$('.modal .iconbtn')?.focus();}
function confirmDialog(title,message,{phrase='',reason=false,label='Confirm',danger=false}={}){return new Promise(resolve=>{
    showModal(title,`<p>${esc(message)}</p>${phrase?field(`TYPE “${esc(phrase)}” TO CONFIRM`,'modal-confirmation','','text','id="modal-confirmation" autocomplete="off"'):''}${reason?area('REASON','modal-reason','','This will appear in the activity log.','id="modal-reason" required maxlength="300"'):''}<p id="modal-error" class="error-message"></p><div class="modal-buttons">${button('Cancel','close-modal','ghost')}${button(label,'confirm-modal',danger?'danger':'')}</div>`);
    ui.modalResolve=resolve;ui.modalSubmit=()=>{const confirmation=$('#modal-confirmation')?.value||'',explanation=$('#modal-reason')?.value?.trim()||'';if(phrase&&confirmation!==phrase){$('#modal-error').textContent='Please type the confirmation exactly as shown.';return;}if(reason&&explanation.length<3){$('#modal-error').textContent='Please add a short reason.';return;}closeModal({confirmation,reason:explanation});};
    if(phrase)$('#modal-confirmation')?.focus();else if(reason)$('#modal-reason')?.focus();
});}
async function withBusy(fn,element=null){if(ui.busy)return;ui.busy=true;let previous=null;if(element){previous=element.innerHTML;element.disabled=true;element.innerHTML='<span class="busy-spinner" aria-label="Working"></span>';}
    try{return await fn();}catch(e){if(e.status===409&&B?.player&&!isAdminView()){try{await refresh(true);}catch{}}toast(errorMessage(e),true);}
    finally{ui.busy=false;if(element?.isConnected){element.disabled=false;if(previous!==null)element.innerHTML=previous;}}
}
async function perform(action,data={}){const result=await api('/api/'+action,{...data,requestId:data.requestId||uid()});await refresh(true);return result;}
function updateTimers(){const cfg=config();if(!cfg?.timerEnabled||!cfg.deadlineAt)return;const reference=cfg.status==='paused'&&cfg.pausedAt?cfg.pausedAt:Date.now()+serverOffset;const seconds=Math.max(0,Math.ceil((cfg.deadlineAt-reference)/1000));const hours=Math.floor(seconds/3600),mins=Math.floor((seconds%3600)/60),secs=seconds%60;const val=(hours?String(hours).padStart(2,'0')+':':'')+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');$$('[data-timer]').forEach(e=>e.textContent=val);}
function lines(value){return String(value||'').split('\n').map(x=>x.trim()).filter(Boolean);}
function pairs(value){return lines(value).map(line=>{const pos=line.indexOf('|');return pos<0?[line.trim(),'']:[line.slice(0,pos).trim(),line.slice(pos+1).trim()];});}
function readEditor(){const form=$('#mission-editor');if(!form)return ui.editMission;const fd=new FormData(form);const m=JSON.parse(JSON.stringify(ui.editMission));m.title=fd.get('mission-title');m.subtitle=fd.get('mission-subtitle');m.clue=fd.get('mission-clue');m.verified=fd.has('mission-verified');m.hints=[];
    for(let i=0;i<3;i++){const hint=fd.get(`hint-${i}-text`)?.trim();if(hint)m.hints.push({text:hint,cost:Number(fd.get(`hint-${i}-cost`)),delaySeconds:Number(fd.get(`hint-${i}-delay`))});}
    m.stages=$$('[data-stage-index]',form).map((card,i)=>{const get=name=>card.querySelector(`[name="${name}"]`)?.value??'';const s={...m.stages[i],label:get('label'),type:get('type'),prompt:get('prompt'),points:Number(get('points')),attempts:Number(get('attempts')),grading:get('grading')};
        if(['text','observation','puzzle'].includes(s.type)){s.accepted=lines(get('accepted'));s.keywords=lines(get('keywords'));s.matchMode=get('matchMode')||'exact';s.caseSensitive=!!card.querySelector('[name="caseSensitive"]')?.checked;}
        if(['choice','multi'].includes(s.type)){s.options=lines(get('options'));s.correct=s.type==='multi'?lines(get('correct')):get('correct').trim();}
        if(s.type==='number'){s.correct=Number(get('correct'));s.tolerance=Number(get('tolerance'));if(get('minAnswer')!==''||get('maxAnswer')!==''){s.minAnswer=Number(get('minAnswer'));s.maxAnswer=Number(get('maxAnswer'));}else{delete s.minAnswer;delete s.maxAnswer;}}
        if(['matching','ordering'].includes(s.type)){s.items=pairs(get('items')).map(([id,text])=>({id,text}));if(s.type==='matching'){s.categories=lines(get('categories'));s.correct=Object.fromEntries(pairs(get('correct')));}else{s.correct=get('correct').split(',').map(x=>x.trim()).filter(Boolean);}}
        return s;});return m;
}
function newStage(type='text'){const s={id:'stage_'+uid().replace(/[^a-zA-Z0-9]/g,'').slice(0,12),label:'New challenge',type,prompt:'',points:10,attempts:2,grading:'auto'};if(['text','puzzle','observation'].includes(type)){s.accepted=['answer'];s.keywords=[];s.matchMode='exact';}if(['photo','team'].includes(type)){s.grading=type==='team'?'manual':'photo';s.label=type==='team'?'Team moment':'Prove it';}if(['choice','multi'].includes(type)){s.options=['Option A','Option B','Option C'];s.correct=type==='multi'?['Option A']: 'Option A';}if(type==='number'){s.correct=1;s.tolerance=0;}if(['matching','ordering'].includes(type)){s.items=[{id:'a',text:'Item A'},{id:'b',text:'Item B'}];if(type==='matching'){s.categories=['Category 1','Category 2'];s.correct={a:'Category 1',b:'Category 2'};}else{s.correct=['a','b'];}}return s;}
function downloadText(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function demoExport(kind){let rows=[];if(kind==='scores')rows=[['Team','Score','Missions completed','Finished at'],...A.teams.map(t=>[t.name,t.score,Math.min(t.index,8),t.completedAt||''])];else if(kind==='ledger')rows=[['Team','Points','Reason','Time'],...A.ledger.map(l=>[l.team,l.points,l.reason,l.at])];else rows=[['Team','Mission','Stage','Answer','Points','Status'],...A.submissions.map(s=>[s.teamName,s.mission,s.label,prettyAnswer(s.answer),s.points,s.status])];const csv=rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}).join(',')).join('\r\n');downloadText(`city-hunt-${kind}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');}

// Keep taps declarative so the production Content Security Policy needs no inline scripts.
document.addEventListener('click',async event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
    event.preventDefault();const act=el.dataset.action;
    if(act==='close-modal'){closeModal();return;}if(act==='confirm-modal'){ui.modalSubmit?.();return;}
    if(act==='navigate'){await go(el.dataset.page||'');return;}if(act==='go-admin'){await go('admin');return;}

    if(act==='toggle-hints'){ui.hints=!ui.hints;captureDraft();render();return;}
    if(act==='found'){ui.found=true;storeWrite('ch:found:'+stateKey(S),true);render();return;}
    if(act==='view-clue'){showModal('Your mystery clue',`<p class="preline">${esc(S.current.clue)}</p>`);return;}
    if(act==='camera'){if(!playable()){toast('The game is not currently live. Your progress is safe.',true);return;}$('#camera-input')?.click();return;}
    if(act==='pick-photo'){$('#gallery-input')?.click();return;}
    if(act==='continue'){ui.receipt=null;await go('hunt');return;}
    if(act==='show-finish'){ui.receipt={finished:true};render();return;}
    if(act==='order'){const d=captureDraft(),idx=Number(el.dataset.index),other=idx+Number(el.dataset.delta);if(!d||other<0||other>=d.length)return;[d[idx],d[other]]=[d[other],d[idx]];storeWrite('ch:draft:'+stateKey(S),{answer:d});render();return;}
    if(act==='open-photo'){const sub=(isAdminView()?A.submissions:S.submissions).find(s=>s.id===el.dataset.id);if(sub)showModal(sub.missionTitle,`<img class="modal-photo" src="${esc(sub.photo)}" alt="${esc(sub.label)}"><p>${esc(sub.teamName)} · ${esc(sub.player)} · ${fmtTime(sub.at)}</p><p class="smalltext mt">${esc(sub.label)} · ${sub.points}/${sub.maxPoints} points · ${esc(sub.status)}</p>${sub.comment?`<p class="mt">Organiser: ${esc(sub.comment)}</p>`:''}`,true);return;}
    if(act==='edit-mission'){ui.editId=Number(el.dataset.id);ui.editMission=JSON.parse(JSON.stringify(A.missions.find(m=>m.id===ui.editId)));render();window.scrollTo(0,0);return;}
    if(act==='cancel-edit'){ui.editId=null;ui.editMission=null;ui.formDirty=false;render();return;}
    if(act==='add-stage'){ui.editMission=readEditor();if(ui.editMission.stages.length>=12){toast('A mission can have up to 12 stages.',true);return;}ui.editMission.stages.push(newStage());render();$$('.editor-stage').at(-1)?.scrollIntoView({block:'start'});return;}
    if(act==='remove-stage'){ui.editMission=readEditor();if(ui.editMission.stages.length<=1){toast('Keep at least one challenge stage.',true);return;}ui.editMission.stages.splice(Number(el.dataset.index),1);render();return;}
    if(act==='team-reviews'){ui.adminTab='reviews';ui.reviewTeam=el.dataset.team;ui.reviewStatus='all';render();return;}
    if(act==='export'){if(DEMO)demoExport(el.dataset.kind);else window.open('/api/export?kind='+encodeURIComponent(el.dataset.kind),'_blank','noopener');return;}
    if(act==='backup'){if(DEMO){toast('Private database backups are available in the multiplayer server build.');}else window.open('/api/backup','_blank','noopener');return;}
    if(act==='team-qr'){window.open('/api/qr?team='+$('#qr-team').value,'_blank','noopener');return;}
    if(act==='copy-link'){try{await navigator.clipboard.writeText(location.origin);toast('Game link copied.');}catch{showModal('Copy this game link',`<p class="join-url">${esc(location.origin)}</p>`);}return;}
    if(act==='demo-reset'){if(await confirmDialog('Start the demo again?','This clears the local demo scores, photos and players. It does not affect a hosted event.',{label:'Reset demo',danger:true})){await window.CITY_DEMO.reset();S=null;A=null;ui={...ui,page:'',receipt:null,editId:null,photo:null,formDirty:false};await bootstrap();history.replaceState(null,'','#');render();}return;}
    if(act==='logout'){if(!(await confirmDialog('Leave this device?','Your team progress stays saved. You can rejoin with your team code.',{label:'Leave this device'})))return;await withBusy(async()=>{await api('/api/logout',{});S=null;await bootstrap();await go('');},el);return;}
    if(act==='admin-logout'){await withBusy(async()=>{await api('/api/admin/logout',{});A=null;await bootstrap();await go('admin');},el);return;}
    if(act==='control'){const command=el.dataset.command;let approved=true;
        if(['start','end','reveal'].includes(command)){let message=command==='start'?(A.config.rehearsal?'Start the rehearsal with sample, unverified mission content?':'Start the event for all eight teams?'):command==='end'?'Stop player submissions for all teams? You can still review answers and adjust scores.':A.submissions.some(s=>s.status==='pending')?'Some submissions are still awaiting review. Reveal these provisional scores to players?':'Reveal the final rankings to all teams?';approved=await confirmDialog(command==='start'?'Ready to start?':command==='end'?'End the hunt?':'The big reveal.',message,{label:command==='start'?'Start game':command==='end'?'End game':'Reveal results'});}
        if(approved)await withBusy(async()=>{await perform('admin/control',{command});toast(command==='reveal'?'Results revealed.':'Game control updated.');},el);return;}
    if(act==='hint'){const hint=S.current.hints[Number(el.dataset.index)];const consent=await confirmDialog(`Unlock hint ${hint.index+1}?`,hint.cost?`This will deduct ${hint.cost} points from your shared team score.`:'This hint is free. Everyone on your team will see it.',{label:hint.cost?`Use hint · −${hint.cost} pts`:'Use free hint'});if(consent)await withBusy(async()=>{await perform('hint',{missionId:S.current.id,index:hint.index});ui.hints=true;render();},el);return;}
    if(act==='pause-team'){await withBusy(async()=>{await perform('admin/team',{team:Number(el.dataset.team),paused:el.dataset.paused==='true'});toast('Team status updated.');},el);return;}
    if(act==='remove-player'){if(await confirmDialog('Remove this player?',`${el.dataset.name} will need to rejoin with the team code. Existing submissions remain saved.`,{label:'Remove player',danger:true})){await withBusy(()=>perform('admin/remove-player',{id:el.dataset.id}),el);}return;}
    if(['skip','reset-mission','reset-team','reset-event'].includes(act)){
        const details={skip:['Skip the current mission?','This moves the team forward without awarding unearned points.','',true,'Skip mission'], 'reset-mission':['Restart this mission?','This restarts only the team’s current mission, reverses its points and hint costs, and retains an audit record.','RESET MISSION',true,'Restart mission'],'reset-team':['Reset this team?','All players in this team are signed out. Scores and progress are cleared. A server backup is created first.','RESET TEAM',false,'Reset team'],'reset-event':['Reset the whole event?','Every team is reset and every player is signed out. Missions and codes are preserved. A server backup is created first.','RESET CITY HUNT',false,'Reset event']}[act];
        const result=await confirmDialog(details[0],details[1],{phrase:details[2],reason:details[3],label:details[4],danger:true});if(!result)return;await withBusy(async()=>{await perform('admin/'+(act==='reset-event'?'reset':act),{team:Number(el.dataset.team),...result});toast('Saved.');},el);return;
    }

    if(act==='start'){await withBusy(async()=>{if(!S.current)return;await api('/api/start',{missionId:S.current.id});ui.page='mission';history.pushState(null,'','#mission');await refresh(true);window.scrollTo(0,0);},el);return;}
    if(act==='submit-photo'){

        await withBusy(async()=>{const track=$('#upload-track'),status=$('#upload-status');track?.classList.remove('hidden');if(status)status.textContent='Uploading photo…';const rid=requestId();
            const result=await api('/api/photo',{missionId:m.id,stageId:m.stage.id,image,requestId:rid},n=>{if(track?.firstElementChild)track.firstElementChild.style.width=n+'%';if(status)status.textContent=n>=99?'Verifying and saving…':`Uploading ${n}%`;});
            storeRemove('ch:request:'+key);await photoDraft('delete',key);ui.photo=null;ui.photoKey=null;ui.photoSaved=false;
            await refresh(true);if(result.missionComplete){ui.receipt=result;render();window.scrollTo(0,0);}else toast(result.pending?'Photo saved. Points await organiser review.':`Photo saved. +${result.award||0} points.`);
        },el);return;
    }
});
document.addEventListener('submit',async event=>{
    const form=event.target;if(!form.dataset.form)return;event.preventDefault();const kind=form.dataset.form,fd=new FormData(form),submit=$('[type="submit"]',form);
    await withBusy(async()=>{
        if(kind==='join'){await api('/api/join',{name:fd.get('name'),team:Number(fd.get('team')),code:fd.get('code')||''});await bootstrap();ui.page='hunt';history.replaceState(null,'','#hunt');await refresh(true);toast('Welcome to the hunt. Your whole team shares one score.');}
        else if(kind==='admin-login'){await api('/api/admin/login',{password:fd.get('password')});await bootstrap();await refresh(true);}
        else if(kind==='answer'){
            const answer=captureDraft(form),m=S.current,key=stateKey(S);if(m.stage.type==='multi'&&(!answer||!answer.length))throw new Error('Select at least one option.');
            const result=await api('/api/submit',{missionId:m.id,stageId:m.stage.id,answer,requestId:requestId()});storeRemove('ch:request:'+key);if(!result.retry)storeRemove('ch:draft:'+key);
            await refresh(true);if(result.missionComplete){ui.receipt=result;render();window.scrollTo(0,0);}else if(result.retry)toast(`${result.message} ${result.remaining} attempt${result.remaining===1?'':'s'} left.`,true);else toast(result.pending?'Answer saved for organiser review.':result.correct?`Correct! +${result.award} points.`:result.message,!result.correct);
        }
        else if(kind==='mission-editor'){const mission=readEditor();await api('/api/admin/mission',{id:ui.editId,mission});ui.editId=null;ui.editMission=null;ui.formDirty=false;await refresh(true);toast('Mission saved.');}
        else if(kind==='team'){ui.formDirty=false;await perform('admin/team',{team:Number(form.dataset.team),name:fd.get('name'),code:fd.get('code')});toast('Team settings saved.');}
        else if(kind==='review'){ui.formDirty=false;await perform('admin/review',{id:form.dataset.id,points:Number(fd.get('points')),comment:fd.get('comment')});toast('Review saved. Team score updated.');}
        else if(kind==='points'){if(!Number(fd.get('points')))throw new Error('Choose a non-zero number of points.');const rid=form.dataset.requestId||(form.dataset.requestId=uid());ui.formDirty=false;await perform('admin/points',{team:Number(fd.get('team')),points:Number(fd.get('points')),reason:fd.get('reason'),category:fd.get('category'),requestId:rid});toast('Points applied to the shared team score.');}
        else if(kind==='announce'){ui.formDirty=false;await perform('admin/announce',{team:fd.get('team')==='all'?null:Number(fd.get('team')),message:fd.get('message')});toast('Announcement sent.');}
        else if(kind==='settings'){const data=Object.fromEntries(fd);for(const k of ['requireCodes','rehearsal','leaderboard','timerEnabled'])data[k]=fd.has(k);data.lockAt=Number(data.lockAt);data.durationMinutes=Number(data.durationMinutes);ui.formDirty=false;await perform('admin/settings',data);await bootstrap();toast('Event settings saved.');}
    },submit);
});
document.addEventListener('input',event=>{if(event.target.closest('form[data-form="answer"]'))captureDraft();else if(event.target.closest('form'))ui.formDirty=true;});

    const el=event.target;if(['camera-input','gallery-input'].includes(el.id)){await withBusy(()=>choosePhoto(el.files?.[0]));return;}
